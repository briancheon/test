<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Switch 2</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #26262a, #0c0c0e 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .wrap {
    text-align: center;
  }

  .device {
    position: relative;
    width: 700px;
    max-width: 90vw;
    filter: drop-shadow(0 25px 45px rgba(0,0,0,0.55));
  }

  img.switch2 {
    display: block;
    width: 100%;
    height: auto;
  }

  /* Overlay positioned over the physical screen area of the photo.
     The photo's own screen content (the boot logo) shows through as
     this overlay fades/flickers away, simulating a power-on. */
  .game-screen {
    position: absolute;
    left: 23.6%;
    top: 34%;
    width: 54.6%;
    height: 31.3%;
    overflow: hidden;
    border-radius: 2px;
  }

  .power-black {
    position: absolute;
    inset: 0;
    background: #000;
    z-index: 3;
    animation: power-black 6s ease-in-out infinite;
  }

  .power-line {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 0;
    background: #fff;
    box-shadow: 0 0 12px 3px rgba(255,255,255,0.9);
    transform: translateY(-50%);
    z-index: 4;
    opacity: 0;
    animation: power-line 6s ease-in-out infinite;
  }

  @keyframes power-black {
    0%   { opacity: 1; }
    36%  { opacity: 1; }
    40%  { opacity: 0.5; }
    43%  { opacity: 0.85; }
    46%  { opacity: 0.15; }
    49%  { opacity: 0.6; }
    52%  { opacity: 0; }
    88%  { opacity: 0; }
    92%  { opacity: 1; }
    100% { opacity: 1; }
  }

  @keyframes power-line {
    0%   { opacity: 0; height: 0; }
    34%  { opacity: 0; height: 0; }
    37%  { opacity: 1; height: 1px; }
    40%  { opacity: 1; height: 3px; }
    44%  { opacity: 1; height: 100%; }
    50%  { opacity: 0; height: 100%; }
    100% { opacity: 0; height: 100%; }
  }

  .caption {
    margin-top: 20px;
    color: #9a9a9f;
    font-size: 14px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="device">
    <img class="switch2" src="nintendoswitch2_hw_24_1_ecommerce_a549.png" alt="Nintendo Switch 2">
    <div class="game-screen">
      <div class="power-line"></div>
      <div class="power-black"></div>
    </div>
  </div>
  <div class="caption">Nintendo Switch 2</div>
</div>
</body>
</html>
